<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#9e1328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 대사">
<title>오늘의 대사 영어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
/*
VOICE: 친구가 아침에 보내주는 영어 쪽지. 가볍고 다정하게, 글자는 크게.
IDEA: 영화표. 매일 한 장씩 뜯어 보는 입장권, 절취선 아래는 공부 노트.
PICTURE: 오늘의 대사를 크게 박은 티켓 한 장이 첫 화면의 주인공.
COLOUR and TYPE: 극장 의자 레드 + 연분홍 바탕 + 팝콘 옐로 포인트. 영어는 Archivo Black, 한글은 Noto Sans KR.
LAYOUT: 한 열, 폰 우선. 티켓 → 핵심 표현 → 단어 → 예문 → 미션, 아래에 지난 대사 목록.
*/
:root{color-scheme:light dark;
--bg:light-dark(#fff1f2,#1a0b0e);--paper:light-dark(#ffffff,#2a1418);--ink:light-dark(#2b1216,#fbe9ec);
--soft:light-dark(#7a5a60,#c9a7ad);--red:light-dark(#d7263d,#ff5a6e);--deep:light-dark(#9e1328,#7a0f1f);
--pop:light-dark(#ffd23f,#ffd23f);--line:light-dark(#f3cdd3,#4a2a30);--chip:light-dark(#ffe4e8,#3a1d22)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.top{background:var(--deep);color:#fff;padding:18px max(5vw,16px) 70px;
 background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 28px,transparent 28px 56px)}
.top .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:900 20px/1.1 "Noto Sans KR";letter-spacing:-.5px}
.brand b{color:var(--pop)}
.streak{font-size:14px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:99px}
main{max-width:720px;margin:-52px auto 0;padding:0 max(4vw,14px) 60px}
.ticket{background:var(--paper);border-radius:22px;box-shadow:0 18px 40px -18px rgba(120,10,30,.45);position:relative;overflow:hidden}
.t-head{background:var(--red);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.t-head strong{font-size:16px}
.t-body{padding:26px 22px 22px}
.quote{font:400 clamp(30px,7vw,46px)/1.1 "Archivo Black",sans-serif;letter-spacing:-.5px;margin:0 0 12px;text-wrap:balance}
.ko{font:400 20px/1.5 "Gowun Dodum",sans-serif;color:var(--soft);margin:0}
.ko.hide{filter:blur(7px);cursor:pointer;user-select:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
button{font:500 15px "Noto Sans KR";min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--red)}
button:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
button.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.on{background:var(--pop);color:#2b1216;border-color:var(--pop)}
.perf{height:0;border-top:3px dashed var(--line);margin:0 18px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-15px;width:28px;height:28px;border-radius:50%;background:var(--bg)}
.perf::before{left:-32px}.perf::after{right:-32px}
.say{background:var(--chip);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:15px}
.say b{color:var(--red)}
.k{font-weight:700;color:var(--red)}
.stress{font-weight:900;text-decoration:underline;text-decoration-color:var(--pop);text-decoration-thickness:5px;text-underline-offset:-1px;text-decoration-skip-ink:none}
section{background:var(--paper);border-radius:18px;padding:22px;margin-top:16px}
h2{font:900 22px/1.2 "Noto Sans KR";margin:0 0 14px;letter-spacing:-.3px}
h2 small{font-weight:500;font-size:14px;color:var(--soft);margin-left:6px}
.scene{font-size:16px;color:var(--soft);margin:0}
.card{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.card .en{font:700 18px/1.4 "Noto Sans KR";display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .en span{flex:1}
.card p{margin:6px 0 0;font-size:15.5px}
.play{min-height:40px;min-width:40px;padding:0;border-radius:50%;flex:none;display:grid;place-items:center}
.play svg{width:16px;height:16px;fill:currentColor}
.pr{font-size:14.5px;color:var(--soft);margin-top:6px}
.pr i{font-style:normal;background:var(--chip);padding:1px 7px;border-radius:6px;color:var(--ink)}
.mission{background:var(--pop);color:#2b1216}
.mission h2{color:#2b1216}
.mission textarea{width:100%;min-height:90px;font:16px/1.5 "Noto Sans KR";padding:12px;border-radius:12px;border:0;margin-top:8px;resize:vertical;background:#fffbe8;color:#2b1216}
.list a{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.list a:last-child{border:0}
.list a.cur{color:var(--red);font-weight:700}
.list small{color:var(--soft);white-space:nowrap}
.foot{font-size:13px;color:var(--soft);text-align:center;margin-top:22px}
.speed{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft)}
@media(max-width:600px){.t-body{padding:22px 18px}section{padding:18px}.top{padding-bottom:64px}}
@media(prefers-reduced-motion:no-preference){.ticket{animation:in .5s ease-out}@keyframes in{from{transform:translateY(14px) rotate(-1deg);opacity:0}}}
.mission #review{background:#2b1216;color:#fff;border-color:#2b1216}
</style>
</head>
<body>

 scene:"테드를 촌뜨기라고 얕보던 상대한테 하는 말. 판단하기 전에 한 번이라도 물어봤으면 내가 다트 고수인 걸 알았을 거라는 거지. 그러고 바로 다트로 이겨버림.",
 expr:[
  {en:"curious", ko:"궁금해하는, 호기심 있는", note:"좋은 뜻. 'I'm curious ~'로 시작하면 부드럽게 질문할 수 있어.", say:"<span class='stress'>큐</span>리어스", tip:"'큐-리'에서 r 굴리기"},
  {en:"judgmental", ko:"색안경 낀, 남을 쉽게 판단하는", note:"꽤 부정적. 'You're being judgmental'은 좀 세게 들려.", say:"저쥐<span class='stress'>멘</span>틀", tip:"dg는 '쥐', 끝 l은 혀끝 살짝 올리며 '틀'"},
  {en:"A, not B", ko:"B 말고 A", note:"대비시키면 말이 짧고 세져. 예: Facts, not feelings.", say:"<span class='stress'>팩</span>츠, 낫 <span class='stress'>필</span>링즈", tip:"A랑 B 둘 다에 힘 주고 not은 약하게"}
 ],
 words:[
  {en:"assume", ko:"(확인 없이) 그렇다고 치다", ex:"Don't assume. Just ask.", exKo:"넘겨짚지 말고 그냥 물어봐.", say:"어<span class='stress'>쑴</span> · 돈 어쑴. 저스트 <span class='stress'>애</span>스크", tip:"assume은 뒤에 힘. Just ask는 '저스태스크'처럼 이어 붙여"},
  {en:"jump to conclusions", ko:"성급하게 결론 내리다", ex:"Let's not jump to conclusions.", exKo:"성급하게 결론 내리지 말자.", say:"렛츠 낫 <span class='stress'>점</span>프 투 컨<span class='stress'>클루</span>젼즈", tip:"to는 '터'로 약하게, conclusions는 '클루'에 힘"},
  {en:"give someone the benefit of the doubt", ko:"일단 좋게 봐주다", ex:"I'll give him the benefit of the doubt.", exKo:"일단 그 사람 좋게 봐줄래.", say:"아일 기빔 더 <span class='stress'>베</span>네핏 오브 더 <span class='stress'>다</span>웃", tip:"give him은 h가 빠져서 '기빔'. doubt의 b는 묵음!"}
 ],
 use:[
  {tag:"회의에서", en:"Before we jump to conclusions, let's check the raw data.", ko:"결론 내기 전에 원본 데이터부터 보죠.", say:"비포 위 <span class='stress'>점</span>프 터 컨클루젼즈, 렛츠 첵 더 <span class='stress'>로</span> 데이터", tip:"check the는 '체더'처럼 이어지고, raw는 '로-'로 길게"},
  {tag:"정산 숫자 안 맞을 때", en:"I'm not blaming anyone. I'm just curious where the gap came from.", ko:"누구 탓하는 거 아니고, 차이가 어디서 났는지 궁금해서요.", say:"암 낫 <span class='stress'>블레</span>이밍 애니원. 암 저스트 <span class='stress'>큐</span>리어스 웨어 더 <span class='stress'>갭</span> 케임 프럼", tip:"I'm은 '암'으로 짧게. gap에 힘 주면 포인트가 산다"},
  {tag:"친구한테", en:"Don't be so judgmental. You haven't even met him.", ko:"색안경 끼지 마, 만나보지도 않았잖아.", say:"돈 비 <span class='stress'>쏘</span> 저쥐멘틀. 유 <span class='stress'>해</span>븐 이븐 <span class='stress'>멧</span> 힘", tip:"Don't의 t는 거의 삼켜서 '돈'. met him은 '메팀'처럼 이어 붙여"}
 ],
 mission:"오늘 회사에서 '일단 확인해보자' 싶은 순간이 오면 속으로 \"Let's not jump to conclusions\" 한 번 말해보기. 아래 칸에 나만의 문장도 하나 써봐."
},
/*ENTRIES-END*/
];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ico='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>';
const playBtn=t=>`<button class="play" data-say="${esc(t)}" aria-label="듣기">${ico}</button>`;
let rate=store.get("rate",0.9);
let hideKo=store.get("hideKo",false);
const done=store.get("done",{});

function speak(t){
 try{const s=window.speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=rate;
  const v=s.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)u.voice=v;s.speak(u)}catch(e){}
}

function render(){
 const id=location.hash.slice(1);
 const e=ENTRIES.find(x=>"d"+x.id.replace(/-/g,"")===id)||ENTRIES[0];
 const n=Object.keys(done).length;
 document.getElementById("streak").textContent=`외운 대사 ${n} / ${ENTRIES.length}`;
 document.getElementById("app").innerHTML=`
 <article class="ticket">
  <div class="t-head"><span><strong>${esc(e.show)}</strong> · ${esc(e.where)}</span><span>${esc(e.date)} · ${esc(e.genre)}</span></div>
  <div class="t-body">
   <p class="quote">“${esc(e.quote)}”</p>
   <p class="ko ${hideKo?"hide":""}" id="ko" title="눌러서 보기">${esc(e.ko)} <span style="font-size:15px">— ${esc(e.who)}</span></p>
   <div class="say">🗣 <b>${e.sayKo}</b><br>${esc(e.sayTip)}</div>
   <div class="row">
    <button class="main" data-say="${esc(e.quote)}">🔊 듣기</button>
    <button id="slow" class="${rate<0.8?"on":""}">🐢 천천히</button>
    <button id="hide" class="${hideKo?"on":""}">${hideKo?"해석 보이기":"해석 가리기"}</button>
    <button id="done" class="${done[e.id]?"on":""}">${done[e.id]?"✔ 외웠어":"외웠으면 체크"}</button>
   </div>
  </div>
  <div class="perf"></div>
  <div class="t-body" style="padding-top:18px"><h2 style="font-size:17px;margin:0 0 6px">📌 어떤 장면이냐면</h2><p class="scene">${esc(e.scene)}</p></div>
 </article>

 <section><h2>🔑 핵심 표현</h2>
  ${e.expr.map(x=>`<div class="card"><div class="en"><span>${esc(x.en)} <span style="font-weight:500;color:var(--soft);font-size:15px">${esc(x.ko)}</span></span>${playBtn(x.en)}</div>
   <p>${esc(x.note)}</p><div class="pr">발음 <i>${x.say}</i> · ${esc(x.tip)}</div></div>`).join("")}
 </section>

 <section><h2>📚 알아둘 단어</h2>
  ${e.words.map(x=>`<div class="card"><div class="en"><span>${esc(x.en)}</span>${playBtn(x.ex)}</div>
   <p><span class="k">뜻</span> ${esc(x.ko)}</p><p>“${esc(x.ex)}” <span class="kx" style="color:var(--soft)">${esc(x.exKo)}</span></p>
   <div class="pr">발음 <i>${x.say}</i> · ${esc(x.tip)}</div></div>`).join("")}
 </section>

 <section><h2>💬 이렇게 써먹어</h2>
  ${e.use.map(x=>`<div class="card"><div style="font-size:13px;color:var(--red);font-weight:700">${esc(x.tag)}</div>
   <div class="en"><span>${esc(x.en)}</span>${playBtn(x.en)}</div><p class="kx" style="color:var(--soft)">${esc(x.ko)}</p>
   <div class="pr">발음 <i>${x.say}</i> · ${esc(x.tip)}</div></div>`).join("")}
  <div class="row speed">속도 <button data-r="0.7" class="${rate==0.7?"on":""}">느리게</button><button data-r="0.9" class="${rate==0.9?"on":""}">보통</button><button data-r="1.05" class="${rate==1.05?"on":""}">빠르게</button></div>
 </section>

 <section class="mission"><h2>✏️ 오늘의 미션</h2><p style="margin:0">${esc(e.mission)}</p>
  <textarea id="note" placeholder="여기에 영어로 한 문장 써보기">${esc(store.get("note-"+e.id,""))}</textarea><div class="row"><button class="main" id="review">✉️ Claude한테 검토받기</button></div><p id="rvmsg" style="margin:8px 0 0;font-size:14px"></p></section>

 <section class="list"><h2>🎟 지난 대사 <small>${ENTRIES.length}장</small></h2>
  ${ENTRIES.map(x=>`<a href="#d${x.id.replace(/-/g,"")}" class="${x.id===e.id?"cur":""}"><span>${done[x.id]?"✔ ":""}${esc(x.quote)}</span><small>${esc(x.date)} · ${esc(x.show)}</small></a>`).join("")}
 </section>`;
 if(hideKo)document.querySelectorAll(".kx").forEach(k=>k.classList.add("ko","hide"));
 bind(e);
}

function bind(e){
 const app=document.getElementById("app");
 app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
 app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{rate=+b.dataset.r;store.set("rate",rate);render()});
 document.getElementById("slow").onclick=()=>{rate=rate<0.8?0.9:0.7;store.set("rate",rate);speak(e.quote);render()};
 document.getElementById("hide").onclick=()=>{hideKo=!hideKo;store.set("hideKo",hideKo);render()};
 document.getElementById("done").onclick=()=>{if(done[e.id])delete done[e.id];else done[e.id]=1;store.set("done",done);render()};
 app.querySelectorAll(".hide").forEach(k=>k.onclick=()=>k.classList.remove("hide"));
 const note=document.getElementById("note");note.oninput=()=>store.set("note-"+e.id,note.value);
 const rv=document.getElementById("review"),rm=document.getElementById("rvmsg");
 rv.onclick=async()=>{const t=note.value.trim();if(!t){rm.textContent="먼저 위 칸에 문장을 써줘!";return}
  const p=`영어 회화 공부 중이야. 오늘 카드: ${e.show}의 "${e.quote}"\n핵심 표현: ${e.expr.map(x=>x.en).join(", ")}\n미션: ${e.mission}\n\n내가 쓴 문장:\n${t}\n\n1) 문법·어색한 부분 고쳐줘 2) 원어민이면 어떻게 말할지 자연스러운 버전 2개 3) 오늘 표현을 제대로 썼는지 4) 발음 팁 한 줄. 한국어 반말로 짧고 솔직하게.`;
  let copied=false;try{await navigator.clipboard.writeText(p);copied=true}catch(err){}
  rm.textContent=copied?"Claude 창이 열려. 입력칸이 비어 있으면 붙여넣기(길게 눌러 붙여넣기)만 하고 보내면 돼.":"Claude 창이 열려. 내용이 안 채워져 있으면 문장을 직접 붙여넣어줘.";
  const a=document.createElement("a");a.href="https://claude.ai/new?q="+encodeURIComponent(p);a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()};
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
}
</script>
</body>
</html>
